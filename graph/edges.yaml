# main.hub — edges (hand-edited source of truth).
#
# EVERY edge carries evidence: a file in a PUBLIC repository, pinned in graph/lock.yaml, that
# contains the literal `match` text EXACTLY ONCE. `python scripts/hub.py check --workspace ..`
# re-reads the pinned blob and fails if the text is gone or ambiguous. `match` must be a phrase
# that STATES the relation - a bare repository name is rejected by the checker.
# `in` defaults to the `from` repository; when it names another repository, the relation is
# stated by a third party and the node card shows that.
types:
  authority-for:              "a policy or map file names the repo as the source of record, or the primary lens, for an axis"
  registers-into:             "repo carries its equations under Toledo codes"
  prescribes-registration-in: "repo's method tells its users to register equations in the target"
  requires-gate:              "repo's agent file makes the named gate mandatory or names it as required reading"
  defers-status-to:           "repo does not decide theorem status or provenance itself; the target does"
  delegates-proof-to:         "repo states that generic finite kernels are proved in the target"
  checks-ontology-against:    "repo checks ontology compatibility against the target"
  imports-coq-from:           "target's Coq sources are imported with a provenance manifest"
  builds-on:                  "a file states that the repo rests on the target's foundation or floor"
  reads-shared-math-from:     "repo's agent file sends shared mathematics work to a document in the target"
  declares-lineage-from:      "repo names the target at a pinned commit as the source lineage of a component it ships; the component itself need not exist in the target"
  holds-synced-copy-from:     "ONE named file in the repo is a synced copy of a document in the target; the target holds the source of truth (says nothing about the rest of the repo)"
  companion-of:               "a file (possibly in a third repository) describes the repo as a companion of the target"

# Edges live with the repository they start from: graph/repos/<from>.yaml, key `edges`.
