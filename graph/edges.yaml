# main.hub — edges (hand-edited source of truth).
#
# EVERY edge carries evidence: a file in a PUBLIC repository, pinned in graph/lock.yaml, that
# contains the literal `match` text EXACTLY ONCE. `python scripts/hub.py check --workspace ..`
# re-reads the pinned blob and fails if the text is gone or ambiguous. `match` must be a phrase
# that STATES the relation - a bare repository name is rejected by the checker.
# `in` defaults to the `from` repository; when it names another repository, the relation is
# stated by a third party and the node card shows that.
types:
  authority-for:              "a policy or map file names the repo as the source of record, or the primary lens, for an axis"
  registers-into:             "repo carries its equations under Toledo codes"
  prescribes-registration-in: "repo's method tells its users to register equations in the target"
  requires-gate:              "repo's agent file makes the named gate mandatory or names it as required reading"
  defers-status-to:           "repo does not decide theorem status or provenance itself; the target does"
  delegates-proof-to:         "repo states that generic finite kernels are proved in the target"
  checks-ontology-against:    "repo checks ontology compatibility against the target"
  imports-coq-from:           "target's Coq sources are imported with a provenance manifest"
  builds-on:                  "a file states that the repo rests on the target's foundation or floor"
  reads-shared-math-from:     "repo's agent file sends shared mathematics work to a document in the target"
  declares-lineage-from:      "repo names the target at a pinned commit as the source lineage of a component it ships; the component itself need not exist in the target"
  holds-synced-copy-from:     "ONE named file in the repo is a synced copy of a document in the target; the target holds the source of truth (says nothing about the rest of the repo)"
  companion-of:               "a file (possibly in a third repository) describes the repo as a companion of the target"

edges:
  # --- axis authority -------------------------------------------------------------------
  - {from: toledo, type: authority-for, to: "axis:mathematics",
     evidence: {in: glosa, path: docs/ECOSYSTEM.md, match: "| Equation source of record + lookup gate"}}
  - {from: readout_genesis, type: authority-for, to: "axis:ontology",
     evidence: {in: toledo, path: EQUATION_SOURCE_POLICY.md, match: "Readout Genesis is the primary ontology lens"}}
  - {from: readout_universe, type: authority-for, to: "axis:epistemology",
     evidence: {in: toledo, path: EQUATION_SOURCE_POLICY.md, match: "Readout Universe is the primary epistemology lens"}}
  - {from: glosa, type: authority-for, to: "axis:method",
     evidence: {in: toledo, path: EQUATION_SOURCE_POLICY.md, match: "GLOSA is the primary human"}}
  - {from: information-discrete-math, type: authority-for, to: "axis:mathematical-floor",
     evidence: {in: glosa, path: docs/ECOSYSTEM.md, match: "| Mathematical floor (readout-first number ladder, Coq) | **information-discrete-math"}}

  # --- the backbone sentence --------------------------------------------------------------
  - {from: readout_genesis, type: defers-status-to, to: toledo,
     evidence: {path: AGENTS.md, match: "Toledo records status/provenance"}}
  - {from: readout_genesis, type: delegates-proof-to, to: information-discrete-math,
     evidence: {path: AGENTS.md, match: "IDM proves generic finite kernels"}}

  # --- gates ------------------------------------------------------------------------------
  - {from: readout_genesis, type: requires-gate, to: "gate:TG-RFG-01",
     evidence: {path: AGENTS.md, match: "MUST NOT replace, the canonical Toledo provenance gate"}}
  - {from: information-discrete-math, type: requires-gate, to: "gate:TG-RFG-01",
     evidence: {path: AGENTS.md, match: "## Mandatory Toledo-Genesis reuse-first gate"}}
  - {from: readout-problem-navier-stokes, type: requires-gate, to: "gate:TG-RFG-01",
     evidence: {path: AGENTS.md, match: "before introducing or renaming a mathematical object"}}

  # --- registration and Coq provenance ----------------------------------------------------
  - {from: information-discrete-math, type: registers-into, to: toledo,
     evidence: {path: docs/TOLEDO_CODES.md, match: "was registered into Toledo"}}
  - {from: glosa, type: prescribes-registration-in, to: toledo,
     evidence: {path: methodology/P19_registration.md, match: "| An **equation** (new, revised, or reused in a new domain) | **Toledo**"}}
  - {from: toledo, type: imports-coq-from, to: readout_genesis,
     evidence: {path: coq/readout_genesis/PROVENANCE.json, match: "Files are imported as public GitHub source"}}
  - {from: toledo, type: imports-coq-from, to: readout_universe,
     evidence: {path: coq/readout_universe/PROVENANCE.json, match: "Imported under the MIT terms already granted by the upstream repository"}}
  - {from: toledo, type: imports-coq-from, to: information-discrete-math,
     evidence: {path: coq/information-discrete-math/PROVENANCE.json, match: "Copied verbatim (byte-for-byte diff against the upstream commit above is empty"}}
  - {from: toledo, type: imports-coq-from, to: zero-readout-certifies,
     evidence: {path: coq/zero-readout-certifies/PROVENANCE.json, match: "Copied verbatim (byte-for-byte diff against the upstream commit above is empty"}}
  - {from: toledo, type: imports-coq-from, to: finite-readout-acceleration,
     evidence: {path: coq/finite-readout-acceleration/PROVENANCE.json, match: "Copied verbatim (byte-for-byte diff against the upstream commit above is empty"}}

  # --- lenses and foundations -------------------------------------------------------------
  - {from: readout_universe, type: builds-on, to: information-discrete-math,
     evidence: {path: philosophy.md, match: "The mandatory floor for this"}}
  - {from: skillme, type: builds-on, to: information-discrete-math,
     evidence: {path: README.md, match: "building on the Readout Genesis / Information Discrete Mathematics foundation"}}
  - {from: skillme, type: builds-on, to: readout_genesis,
     evidence: {path: README.md, match: "building on the Readout Genesis / Information Discrete Mathematics foundation"}}
  - {from: zero-readout-certifies, type: companion-of, to: information-discrete-math,
     evidence: {in: glosa, path: docs/ECOSYSTEM.md, match: "zero-readout-certifies (public)<br/>Coq companion to IDM"}}

  # --- a domain repository and the axes it reads ---------------------------------------------
  - {from: readout-problem-navier-stokes, type: defers-status-to, to: toledo,
     evidence: {path: README.md, match: "proposal/equation provenance and tier/status"}}
  - {from: readout-problem-navier-stokes, type: reads-shared-math-from, to: information-discrete-math,
     evidence: {path: AGENTS.md, match: "If working on shared bridge mathematics, read"}}
  - {from: readout-problem-navier-stokes, type: checks-ontology-against, to: readout_genesis,
     evidence: {path: AGENTS.md, match: "is checked next for ontology"}}
  - {from: birca, type: declares-lineage-from, to: readout_genesis,
     evidence: {path: compute/README.md, match: "`morrocwi/readout_genesis`, pinned commit"}}

  # --- one stream, several copies -----------------------------------------------------------
  - {from: readout_universe, type: holds-synced-copy-from, to: readout_genesis,
     evidence: {path: EQUATION_LIBRARY_ROOT_TO_SM_STREAM_solver_arc_private.md, match: "if a mismatch is ever found, Appendix C wins"}}
