# main.hub — axes, lens, gates, artifacts (hand-edited; repositories are in graph/repos/). Everything under nodes/, ROUTES.md,
# llms.txt, graph/hub.* is GENERATED from graph/*.yaml by `python scripts/hub.py build`).
#
# A node is a pointer, never a copy. No equation, theorem statement or claim text lives here.
# class:
#   axis     the repository is the programme's source of record for one axis
#   linked   at least one machine-verified edge (key `edges` in graph/repos/<id>.yaml) connects it to an axis node
#   catalog  public repository of the same programme author with NO verified cross-repo edge yet;
#            listed so an agent can find it, explicitly not claimed to be wired into the graph
owner: morrocwi
host: https://github.com

axes:
  - id: mathematics
    question: "Does this equation / definition / theorem already exist, under which code, at which tier?"
  - id: mathematical-floor
    question: "How is a number, limit, continuum object or operator built as a finite discrete readout?"
  - id: ontology
    question: "What is this object in the one-root picture, and which gate or section does it instantiate?"
  - id: epistemology
    question: "How strong is this claim, and which evidence tier may it carry?"
  - id: method
    question: "How do a human and an AI produce, check and release this piece of knowledge?"

# Step 0. The lens precedes problem decomposition. What the lens SAYS is defined only in the source
# files: each source quotes a phrase that must occur exactly once in the pinned file. A facet `label`
# is this hub's close paraphrase of that one sentence, kept to the source's own scope, and is not
# machine-verified. A facet with no source fails the check. Applying the lens before every route is
# this hub's ordering rule (logbook D10), not something the sources say about every problem.
lens:
  id: READOUT-LENS
  name: "Lens first - an ordering rule"
  instruction: "Before you commit to a classification, a decomposition, a hypothesis, a route or a solution, read the files under Read first. Then write a short lens note on the raw input, answering what those files ask for, and keep it with your work."
  then: "Record the problem type after the lens note, not before, and only then pick a route. If a later step contradicts the note, revise the note in the open."
  facets:
    - {id: readout-not-thing, label: "there is no truth-behind-the-claim to read off directly; what you have, when you assert something, is a finite readout (stated there as a stance, tier Dr)"}
    - {id: strength-matches-evidence, label: "name which kind of readout you have, and never let the label creep stronger than its evidence"}
    - {id: lens-in-lens-out, label: "before touching evidence for any claim, translate the problem into the readout vocabulary, analyse there, then translate back (a rule that file marks tier Dr)"}
    - {id: retained-difference, label: "separate what difference is retained, from what state, under what context/query/resolution"}
    - {id: finite-retained-difference, label: "everything an agency reads is a finite retained difference - a readout (stated there as a stance, tier Dr)"}
    - {id: readout-not-truth, label: "readout-not-truth - verified structure is not physical truth, and every claim carries a tier"}
    - {id: declared-lens, label: "every hypothesis statement carries a signature line naming the lens its lens_ref points at"}
  sources:
    - {repo: readout_universe, read: first, path: plugins/readout-universe/skills/readout-universe/SKILL.md, facet: readout-not-thing,
       match: "There is no truth-behind-the-claim waiting to be read off directly"}
    - {repo: readout_universe, read: first, path: plugins/readout-universe/skills/readout-universe/SKILL.md, facet: strength-matches-evidence,
       match: "name which kind of readout you have"}
    - {repo: glosa, read: first, path: methodology/P00_lens.md, facet: lens-in-lens-out,
       match: "never analyse a problem directly in world-language and call the result rigorous"}
    - {repo: skillme, read: first, path: plugins/skillme/skills/skillme/SKILL.md, facet: retained-difference,
       match: "what difference is retained, from what state"}
    - {repo: information-discrete-math, read: also, path: plugins/information-discrete-math/skills/information-discrete-math/SKILL.md, facet: finite-retained-difference,
       match: "Everything an agency ever reads is a finite retained difference"}
    - {repo: readout_genesis, read: also, path: README.md, facet: readout-not-truth,
       match: "Verified structure is not physical truth"}
    - {repo: glosa, read: also, path: plugins/glosa/skills/glosa-blackbox-note/SKILL.md, facet: declared-lens,
       match: "Every hypothesis statement carries a signature line naming the lens `lens_ref` points at"}

# Repositories live one per file in graph/repos/<id>.yaml (node, surfaces and outgoing edges).

gates:
  - id: TG-RFG-01
    name: "Toledo-Genesis reuse-first gate"
    summary: "Toledo lookup, Genesis compatibility, reuse the existing object, derive only the missing piece, mark PROPOSAL."
    defined_in: {repo: toledo, path: EQUATION_SOURCE_POLICY.md, match: "**Rule ID:** `TG-RFG-01`"}
  - id: TIER-TAGGING
    name: "Evidence-tier tagging"
    summary: "A claim's stated strength never exceeds what was actually checked, measured or declared."
    defined_in: {repo: readout_universe, path: plugins/readout-universe/skills/readout-universe/SKILL.md, match: "stated strength never exceeds"}
  - id: GLOSA-PUBLISH-GATE
    name: "glosa publish gate"
    summary: "Release gate with leak scan and knowledge-state semantics; maker is not checker."
    defined_in: {repo: glosa, path: methodology/P10_publish_gate.md, match: "# P10 — Publish gate"}
  - id: BIRCA-SAFETY-GATE
    name: "birca immediate safety gate"
    summary: "An emergency and red-flag screen runs before any interpretation, cannot be skipped by user request or claimed consent; unknown safety status counts as unresolved; the skill's system prompt adds that it must not be delayed by extensive history-taking. The skill is not a substitute for emergency services or a clinician."
    defined_in: {repo: birca, path: SKILL.md, match: "Immediate Safety Gate"}

artifacts:
  - id: universe-step-by-step
    name: "Root to Standard-Model equation stream (Appendix C, SM domain equation stream)"
    note: "One stream, more than one public copy. When copies disagree the source of truth wins."
    source_of_truth: {repo: readout_genesis, path: READOUT_GENESIS_CORE.md, match: "APPENDIX C (SM DOMAIN EQUATION STREAM"}
    mirrors:
      - {repo: readout_universe, path: EQUATION_LIBRARY_ROOT_TO_SM_STREAM_solver_arc_private.md, match: "Appendix C wins"}
    codes_in: {repo: toledo, path: registry/genesis_root.json}
