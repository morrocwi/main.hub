# glosa - one repository = one file. Add or remove with `python scripts/hub.py add|remove`.
id: glosa
class: axis
axis: method
role: 'Rigour Without Infrastructure: standalone-scholar methodology for human-AI knowledge co-production.'
is:
- method + human-AI collaboration lens
- claim card, blackbox note, independent check, publish gate
is_not:
- a source of equations
- a certification authority
surfaces:
- kind: plugin
  name: glosa plugin
  path: .claude-plugin/marketplace.json
  marketplace: yaoharee-lahtee-glosa
  plugin: glosa
  use: Installs the glosa method skills.
- kind: skill
  name: glosa master skill
  path: plugins/glosa/skills/glosa/SKILL.md
  use: Entry point to the method skills - claim card, blackbox note, independent check, literature review, publish
    gate, project advisor.
- kind: prompt
  name: glosa prompt packet
  path: plugins/glosa/PROMPT_PACKET.md
  use: The same method as a vendor-neutral prompt for agents without a plugin system.
- kind: mcp
  name: glosa MCP server
  path: mcp/README.md
  use: One tool per kernel function - validate cards, notes and reports, gate a release; stdlib-only, stdio.
- kind: cli
  name: glosa CLI
  path: cli/README.md
  use: check, self-test and literature-review commands over the same kernel.
- kind: skill
  name: glosa-blackbox-note skill
  path: plugins/glosa/skills/glosa-blackbox-note/SKILL.md
  use: Blackbox note - verbatim dialogue lines, cooking log, lens_used block, hypothesis signature.
- kind: skill
  name: glosa-claim-card skill
  path: plugins/glosa/skills/glosa-claim-card/SKILL.md
  use: Five-questions claim card (stub or full).
- kind: skill
  name: glosa-deliver skill
  path: plugins/glosa/skills/glosa-deliver/SKILL.md
  use: Delivery skill of the glosa method; read the file for its scope.
- kind: skill
  name: glosa-independent-check skill
  path: plugins/glosa/skills/glosa-independent-check/SKILL.md
  use: Independent check - maker, checker and approver kept separate; independence ladder.
- kind: skill
  name: glosa-literature-review skill
  path: plugins/glosa/skills/glosa-literature-review/SKILL.md
  use: Literature review in six stages with two exit gates.
- kind: skill
  name: glosa-obsidian skill
  path: plugins/glosa/skills/glosa-obsidian/SKILL.md
  use: Obsidian vault skill of the glosa method; read the file for its scope.
- kind: skill
  name: glosa-project-advisor skill
  path: plugins/glosa/skills/glosa-project-advisor/SKILL.md
  use: Post-release advisor for a project's next conversion step.
- kind: skill
  name: glosa-publish-gate skill
  path: plugins/glosa/skills/glosa-publish-gate/SKILL.md
  use: Publish gate - release rules, leak scan, knowledge-state semantics.
- kind: skill
  name: glosa-render skill
  path: plugins/glosa/skills/glosa-render/SKILL.md
  use: Rendering skill of the glosa method; read the file for its scope.
enter:
- llms.txt
- AGENTS.md
- plugins/glosa/skills/glosa/SKILL.md
- docs/ECOSYSTEM.md
- CLAIM_BOUNDARY.md
gates:
- GLOSA-PUBLISH-GATE
edges:
- type: authority-for
  to: axis:method
  evidence:
    in: toledo
    path: EQUATION_SOURCE_POLICY.md
    match: GLOSA is the primary human
- type: prescribes-registration-in
  to: toledo
  evidence:
    path: methodology/P19_registration.md
    match: '| An **equation** (new, revised, or reused in a new domain) | **Toledo**'
